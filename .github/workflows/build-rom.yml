name: Build Game Boy ROMs

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (not strictly necessary since we clone separately)
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libpng-dev pkg-config git

      - name: Build rgbds from source
        run: |
          git clone https://github.com/gbdev/rgbds.git
          cd rgbds
          make -j
          sudo make install

      - name: Clone pokered source
        run: git clone https://github.com/pret/pokered.git src

      - name: Build ROMs
        run: |
          cd src
          make -j
          cp pokered.gbc ../pokered.gbc
          cp pokeblue.gbc ../pokeblue.gbc

      - name: Convert to Base64 (single-line)
        run: |
          base64 -w 0 pokered.gbc  > pokered_base64.txt
          base64 -w 0 pokeblue.gbc > pokeblue_base64.txt

      - name: Upload artifacts (.gbc + Base64)
        uses: actions/upload-artifact@v4
        with:
          name: pokered-roms
          path: |
            pokered.gbc
            pokeblue.gbc
            pokered_base64.txt
            pokeblue_base64.txt
